name: CI Pipeline

# 1. Triggers: Define what events cause the workflow to run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger this manually from the GitHub UI

# 2. Jobs: The core tasks executed by the workflow
jobs:
  build-and-test:
    # Specify the runner/operating system environment
    runs-on: ubuntu-latest

    # Sequential steps to execute within this specific job
    steps:
      # Step 1: Check out your repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up a runtime environment (e.g., Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Run custom terminal/shell scripts
      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
